[package]
name = "quantpilot"
version = "1.0.0"
description = "QuantPilot AI desktop shell"
edition = "2021"

[lib]
name = "quantpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
keyring = { version = "3", features = ["windows-native"] }
