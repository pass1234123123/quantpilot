[project]
name = "quantpilot-api"
version = "0.1.0"
description = "QuantPilot AI - cloud API (FastAPI) + NATS JetStream consumer"
requires-python = ">=3.12"
dependencies = [
    "quantpilot-contracts",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "nats-py>=2.7",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
